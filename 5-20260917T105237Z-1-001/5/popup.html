<!DOCTYPE html>
<html>
<head>
    <title>FB Auto-Publish</title>
    <style>
        body {
            width: 250px;
            text-align: center;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 150px;
            background-color: #f4f4f4;
        }
        button {
            padding: 10px 15px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        footer {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <h3>Auto-Publish</h3>
    <button id="start">Start</button>
    <footer>Developed by Hassan</footer>
    <script src="popup.js"></script>
</body>
</html>
