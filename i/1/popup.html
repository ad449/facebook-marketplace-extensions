<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Autofill</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            width: 280px; 
            padding: 15px; 
            background-color: #f9f9f9; 
            text-align: center;
            border-radius: 8px;
        }
        h3 {
            margin-bottom: 10px;
            color: #333;
        }
        label {
            display: block;
            font-weight: bold;
            margin-top: 8px;
            text-align: left;
        }
        input, textarea, button {
            width: 100%; 
            margin-top: 5px; 
            padding: 8px; 
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea {
            resize: none;
            height: 60px;
        }
        button {
            background-color: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }
        .footer span {
            color: red;
        }
    </style>
</head>
<body>
    <h3>FB Marketplace Autofill</h3>

    <label for="title">Title:</label>
    <input type="text" id="title" placeholder="Enter title">

    <label for="price">Price:</label>
    <input type="number" id="price" placeholder="Enter price">

    <label for="description">Description:</label>
    <textarea id="description" placeholder="Enter description"></textarea>

    <label for="imageInput">Upload Images:</label>
    <input type="file" id="imageInput" multiple>

    <label for="tabCount">Number of Tabs:</label>
    <input type="number" id="tabCount" placeholder="Enter number of tabs" min="1">

    <button id="saveData">Save Data</button>
    <button id="openTabs">Open Listings</button>

    <div class="footer">
        Developed by <strong>Hassan</strong> <span>❤️</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
